#file: noinspection ComposeUnknownKeys
services:
  logger.channel.esn_cyprus_core:
    parent: logger.channel_base
    arguments: [ 'esn_cyprus_core' ]

  esn_cyprus_core.file_service:
    class: Drupal\esn_cyprus_core\Service\FileServiceBase
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@file.repository'
      - '@file.usage'
      - '@logger.factory'

  esn_cyprus_core.google_service:
    class: Drupal\esn_cyprus_core\Service\GoogleServiceBase
    arguments:
      - '@config.factory'
      - '@esn_cyprus_core.file_service'
      - '@logger.factory'

  esn_cyprus_core.apple_service:
    class: Drupal\esn_cyprus_core\Service\AppleWalletServiceBase
    arguments:
      - '@esn_cyprus_core.file_service'
      - '@http_client'
      - '@logger.factory'

  esn_cyprus_core.email_manager:
    class: Drupal\esn_cyprus_core\Service\EmailManagerBase
    arguments:
      - '@logger.factory'
      - '@plugin.manager.mail'
      - '@renderer'